name: CI
on: [push, pull_request]
jobs:
  backend-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api-gateway, auth-user-service, catalog-inventory-service, order-cart-service, payment-service, tracking-notification-service]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: mvn -q test
        working-directory: backend/${{ matrix.service }}
