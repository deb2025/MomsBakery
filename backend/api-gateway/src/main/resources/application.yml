server:
  port: 8080
spring:
  cloud:
    gateway:
      routes:
        - id: auth
          uri: http://auth:8081
          predicates: [ Path=/api/auth/** ]
        - id: catalog
          uri: http://catalog:8082
          predicates: [ Path=/api/catalog/** ]
        - id: order
          uri: http://order:8083
          predicates: [ Path=/api/orders/**, Path=/api/cart/** ]
        - id: payment
          uri: http://payment:8084
          predicates: [ Path=/api/payments/** ]
        - id: tracking
          uri: http://tracking:8085
          predicates: [ Path=/api/tracking/**, Path=/ws/** ]
